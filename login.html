<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #111827;
        --primary-hover: #000000;
        --danger: #dc2626;
        --success: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(17, 24, 39, 0.05),
            transparent 35%
          ),
          var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .login-shell {
        width: 100%;
        max-width: 440px;
      }

      .brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .brand-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: var(--primary);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 22px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
      }

      .brand h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.8px;
      }

      .brand p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
      }

      .login-card h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.4px;
      }

      .login-card .subtitle {
        margin: 8px 0 26px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .input-wrapper {
        position: relative;
      }

      .input-wrapper i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 14px;
        pointer-events: none;
      }

      input {
        width: 100%;
        height: 48px;
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 0 14px 0 42px;
        outline: none;
        font-family: inherit;
        font-size: 14px;
        background: #fff;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #9ca3af;
        box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.06);
      }

      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: #9ca3af;
        cursor: pointer;
        padding: 7px;
      }

      .login-button {
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 11px;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
        margin-top: 6px;
      }

      .login-button:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-box {
        display: none;
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: var(--danger);
        font-size: 13px;
        line-height: 1.5;
      }

      .error-box.active {
        display: block;
      }

      .loading {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .footer {
        text-align: center;
        margin-top: 18px;
        color: #9ca3af;
        font-size: 12px;
      }

      .checking {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        font-size: 14px;
        color: var(--muted);
      }

      .checking.hidden {
        display: none;
      }

      .checking-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .checking-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e5e7eb;
        border-top-color: #111827;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
    </style>
  </head>

  <body>
    <div class="checking" id="checkingScreen">
      <div class="checking-inner">
        <div class="checking-spinner"></div>
        <span>Checking session...</span>
      </div>
    </div>

    <main class="login-shell">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-layer-group"></i>
        </div>

        <h1>TaskFlow</h1>
        <p>Internal Team Task Management</p>
      </div>

      <section class="login-card">
        <h2>Welcome back</h2>

        <p class="subtitle">Sign in with your team account to continue.</p>

        <div class="error-box" id="errorBox"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>

            <div class="input-wrapper">
              <i class="fa-regular fa-envelope"></i>

              <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>

              <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Show password"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="login-button" id="loginButton">
            Sign In
          </button>
        </form>
      </section>

      <div class="footer">TaskFlow Internal System</div>
    </main>

    <script type="module">
      import {
        login,
        watchAuth,
        getUserById,
        getReadableFirebaseError,
      } from "./firebase.js";

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginButton = document.getElementById("loginButton");
      const errorBox = document.getElementById("errorBox");
      const togglePassword = document.getElementById("togglePassword");
      const checkingScreen = document.getElementById("checkingScreen");

      let checking = true;
      let redirecting = false;

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add("active");
      }

      function hideError() {
        errorBox.textContent = "";
        errorBox.classList.remove("active");
      }

      function setLoading(loading) {
        loginButton.disabled = loading;

        if (loading) {
          loginButton.innerHTML = `
          <span class="loading">
            <span class="spinner"></span>
            Signing in...
          </span>
        `;
        } else {
          loginButton.textContent = "Sign In";
        }
      }

      async function redirectForUser(user) {
        if (!user || redirecting) {
          return;
        }

        redirecting = true;

        try {
          const profile = await getUserById(user.uid);

          if (!profile) {
            showError(
              "Your account exists, but no TaskFlow profile was found. Please contact an administrator.",
            );
            redirecting = false;
            return;
          }

          if (profile.active === false) {
            showError(
              "Your account is disabled. Please contact an administrator.",
            );
            redirecting = false;
            return;
          }

          if (profile.role === "admin") {
            window.location.replace("admin.html");
            return;
          }

          if (profile.role === "employee") {
            window.location.replace("employee.html");
            return;
          }

          showError("Your account has an invalid role.");
          redirecting = false;
        } catch (error) {
          console.error("Redirect/profile error:", error);
          showError(getReadableFirebaseError(error));
          redirecting = false;
        }
      }

      watchAuth(async (user) => {
        checkingScreen.classList.add("hidden");

        if (user) {
          await redirectForUser(user);
        }

        checking = false;
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        hideError();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showError("Please enter your email and password.");
          return;
        }

        try {
          setLoading(true);

          const user = await login(email, password);

          await redirectForUser(user);
        } catch (error) {
          console.error("Login error:", error);

          showError(getReadableFirebaseError(error));
        } finally {
          if (!redirecting) {
            setLoading(false);
          }
        }
      });

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";

        togglePassword.innerHTML = isPassword
          ? `<i class="fa-regular fa-eye-slash"></i>`
          : `<i class="fa-regular fa-eye"></i>`;
      });
    </script>
  </body>
</html>
